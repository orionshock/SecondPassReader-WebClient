name: secondpassreader-webclient

services:
  secondpassreader-webclient:
    # Prefer an immutable dev-sha-* or release tag for reproducible deployments.
    image: git.zcaprica.duckdns.org/orionshock/secondpassreader-webclient:dev
    environment:
      SECONDPASS_SERVER_PRESETS_JSON: '["https://library.example.com"]'
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
