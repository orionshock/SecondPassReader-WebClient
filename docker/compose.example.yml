name: secondpassreader-webclient

services:
  secondpassreader-webclient:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SECONDPASS_WEBCLIENT_VERSION: ${SECONDPASS_WEBCLIENT_VERSION:-development}
        SECONDPASS_WEBCLIENT_RELEASE_DATE: ${SECONDPASS_WEBCLIENT_RELEASE_DATE:-unknown}
    image: secondpassreader-webclient:local
    env_file:
      - path: .env
        required: false
    # If you do not use .env, uncomment environment and use either JSON or
    # indexed URLs.
    # environment:
    #   SECONDPASS_SERVER_PRESETS_JSON: '["https://library.example.com"]'
    # Or use indexed URLs:
    # environment:
    #   SECONDPASS_SERVER_1_URL: https://library.example.com
    #   SECONDPASS_SERVER_2_URL: http://localhost:8000
    expose:
      - "8000"
    restart: unless-stopped
