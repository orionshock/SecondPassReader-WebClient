name: secondpassreader-webclient

services:
  secondpassreader-webclient:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SECONDPASS_WEBCLIENT_VERSION: ${SECONDPASS_WEBCLIENT_VERSION:-development}
        SECONDPASS_WEBCLIENT_RELEASE_DATE: ${SECONDPASS_WEBCLIENT_RELEASE_DATE:-unknown}
    image: secondpassreader-webclient:local
    env_file:
      - path: .env
        required: false
    # If you do not use .env, uncomment environment and either the JSON value
    # or the indexed values below.
    # environment:
    #   SECONDPASS_SERVER_PRESETS_JSON: '[{"name":"Production Library","url":"https://library.example.com"}]'
    # Or use indexed pairs:
    # environment:
    #   SECONDPASS_SERVER_1_NAME: Production Library
    #   SECONDPASS_SERVER_1_URL: https://library.example.com
    #   SECONDPASS_SERVER_2_NAME: Local Library
    #   SECONDPASS_SERVER_2_URL: http://localhost:8000
    expose:
      - "8000"
    restart: unless-stopped
