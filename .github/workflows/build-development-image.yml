name: Build development image
run-name: Development image from ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-development-image
  cancel-in-progress: false

jobs:
  build:
    name: Verify, build, smoke, and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out complete Git history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up verification environment
        uses: ./.github/actions/setup-verification

      - name: Run the canonical repository gate
        run: npm run verify

      - name: Derive development image metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          release_date=$(git log -1 --format=%cs)
          {
            echo "version=dev-sha-${GITHUB_SHA}"
            echo "release_date=$release_date"
            echo "immutable_image=${image}:dev-sha-${GITHUB_SHA}"
            echo "dev_image=${image}:dev"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and smoke production image
        uses: ./.github/actions/build-production-image
        with:
          tags: ${{ steps.metadata.outputs.immutable_image }}
          smoke_image: ${{ steps.metadata.outputs.immutable_image }}
          app_version: ${{ steps.metadata.outputs.version }}
          release_date: ${{ steps.metadata.outputs.release_date }}

      - name: Publish immutable development image
        env:
          IMMUTABLE_IMAGE: ${{ steps.metadata.outputs.immutable_image }}
        run: docker push "$IMMUTABLE_IMAGE"

      - name: Pull back and smoke immutable development image
        shell: bash
        env:
          IMMUTABLE_IMAGE: ${{ steps.metadata.outputs.immutable_image }}
          EXPECTED_VERSION: ${{ steps.metadata.outputs.version }}
          EXPECTED_RELEASE_DATE: ${{ steps.metadata.outputs.release_date }}
        run: |
          set -euo pipefail
          docker image rm "$IMMUTABLE_IMAGE"
          docker pull "$IMMUTABLE_IMAGE"
          sh tools/smoke-production-image.sh "$IMMUTABLE_IMAGE" "$EXPECTED_VERSION" "$EXPECTED_RELEASE_DATE"

      - name: Publish verified development channel
        shell: bash
        env:
          IMMUTABLE_IMAGE: ${{ steps.metadata.outputs.immutable_image }}
          DEV_IMAGE: ${{ steps.metadata.outputs.dev_image }}
        run: |
          set -euo pipefail
          docker tag "$IMMUTABLE_IMAGE" "$DEV_IMAGE"
          docker push "$DEV_IMAGE"
          immutable_digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMMUTABLE_IMAGE")
          immutable_digest=${immutable_digest#*@}
          docker image rm "$DEV_IMAGE"
          docker pull "$DEV_IMAGE"
          dev_digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$DEV_IMAGE")
          dev_digest=${dev_digest#*@}
          test "$immutable_digest" = "$dev_digest"
          {
            echo "Verified development image: \`$IMMUTABLE_IMAGE\`"
            echo "Development channel: \`$DEV_IMAGE\`"
            echo "Digest: \`$immutable_digest\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove workflow image tags
        if: ${{ always() }}
        shell: bash
        env:
          IMMUTABLE_IMAGE: ${{ steps.metadata.outputs.immutable_image }}
          DEV_IMAGE: ${{ steps.metadata.outputs.dev_image }}
        run: |
          [ -n "$IMMUTABLE_IMAGE" ] && docker image rm "$IMMUTABLE_IMAGE" >/dev/null 2>&1 || true
          [ -n "$DEV_IMAGE" ] && docker image rm "$DEV_IMAGE" >/dev/null 2>&1 || true
