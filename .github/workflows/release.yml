name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - "alpha-rc[0-9]*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify, build, smoke, and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out complete Git history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          tag=${GITHUB_REF#refs/tags/}
          [[ "$tag" =~ ^alpha-rc[0-9]+(\.[0-9]+)?$ ]] || {
            echo "Unsupported release tag: $tag" >&2
            exit 1
          }

      - name: Set up verification environment
        uses: ./.github/actions/setup-verification

      - name: Run the canonical repository gate
        run: npm run verify

      - name: Derive release image metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag=${GITHUB_REF#refs/tags/}
          release_date=$(git log -1 --format=%cs)
          {
            echo "version=$tag"
            echo "release_date=$release_date"
            echo "immutable_image=${image}:sha-${GITHUB_SHA}"
            echo "release_image=${image}:$tag"
            echo "images<<EOF"
            echo "${image}:sha-${GITHUB_SHA}"
            echo "${image}:$tag"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and smoke production image
        uses: ./.github/actions/build-production-image
        with:
          tags: ${{ steps.metadata.outputs.images }}
          smoke_image: ${{ steps.metadata.outputs.immutable_image }}
          app_version: ${{ steps.metadata.outputs.version }}
          release_date: ${{ steps.metadata.outputs.release_date }}

      - name: Publish immutable release tags
        shell: bash
        env:
          IMAGES: ${{ steps.metadata.outputs.images }}
        run: |
          set -euo pipefail
          while IFS= read -r image; do
            [ -n "$image" ] && docker push "$image"
          done <<< "$IMAGES"

      - name: Pull back and smoke exact release tag
        id: published
        shell: bash
        env:
          IMMUTABLE_IMAGE: ${{ steps.metadata.outputs.immutable_image }}
          RELEASE_IMAGE: ${{ steps.metadata.outputs.release_image }}
          EXPECTED_VERSION: ${{ steps.metadata.outputs.version }}
          EXPECTED_RELEASE_DATE: ${{ steps.metadata.outputs.release_date }}
        run: |
          set -euo pipefail
          docker image rm "$IMMUTABLE_IMAGE" "$RELEASE_IMAGE"
          docker pull "$IMMUTABLE_IMAGE"
          docker pull "$RELEASE_IMAGE"
          immutable_digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMMUTABLE_IMAGE")
          immutable_digest=${immutable_digest#*@}
          release_digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$RELEASE_IMAGE")
          release_digest=${release_digest#*@}
          test "$immutable_digest" = "$release_digest"
          sh tools/smoke-production-image.sh "$RELEASE_IMAGE" "$EXPECTED_VERSION" "$EXPECTED_RELEASE_DATE"
          echo "digest=$release_digest" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.metadata.outputs.version }}
          RELEASE_DATE: ${{ steps.metadata.outputs.release_date }}
          IMMUTABLE_IMAGE: ${{ steps.metadata.outputs.immutable_image }}
          RELEASE_IMAGE: ${{ steps.metadata.outputs.release_image }}
          IMAGE_DIGEST: ${{ steps.published.outputs.digest }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/secondpass-release-notes.md"
          {
            printf 'Second Pass Reader %s\n\n' "$TAG"
            printf -- '- Source commit: `%s`\n' "$GITHUB_SHA"
            printf -- '- Source commit date: `%s`\n' "$RELEASE_DATE"
            printf -- '- Release image: `%s`\n' "$RELEASE_IMAGE"
            printf -- '- Immutable image: `%s`\n' "$IMMUTABLE_IMAGE"
            printf -- '- Verified digest: `%s`\n' "$IMAGE_DIGEST"
            printf '\nThe published image passed production smoke verification after pulling it from GHCR.\n'
          } > "$notes"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file "$notes" --prerelease --latest=false
          else
            gh release create "$TAG" --verify-tag --target "$GITHUB_SHA" --title "$TAG" --notes-file "$notes" --prerelease --latest=false
          fi
          cat "$notes" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove workflow image tags
        if: ${{ always() }}
        shell: bash
        env:
          IMMUTABLE_IMAGE: ${{ steps.metadata.outputs.immutable_image }}
          RELEASE_IMAGE: ${{ steps.metadata.outputs.release_image }}
        run: |
          [ -n "$IMMUTABLE_IMAGE" ] && docker image rm "$IMMUTABLE_IMAGE" >/dev/null 2>&1 || true
          [ -n "$RELEASE_IMAGE" ] && docker image rm "$RELEASE_IMAGE" >/dev/null 2>&1 || true
