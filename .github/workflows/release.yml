name: Release

on:
  push:
    tags:
      - "alpha-rc[0-9]*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}
  REGISTRY_IMAGE: ${{ vars.REGISTRY_IMAGE }}

jobs:
  release:
    name: Verify, build, smoke, and publish release
    runs-on: ubuntu-latest
    permissions:
      code: read
      packages: write
    steps:
      - name: Check out complete Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          tag=${GITHUB_REF#refs/tags/}
          [[ "$tag" =~ ^alpha-rc[0-9]+(\.[0-9]+)?$ ]] || {
            echo "Unsupported release tag: $tag" >&2
            exit 1
          }

      - name: Set up verification environment
        uses: ./.github/actions/setup-verification

      - name: Run the canonical repository gate
        run: npm run verify

      - name: Require registry configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$REGISTRY_HOST" || { echo "REGISTRY_HOST is required." >&2; exit 1; }
          test -n "$REGISTRY_IMAGE" || { echo "REGISTRY_IMAGE is required." >&2; exit 1; }

      - name: Derive release image metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          tag=${GITHUB_REF#refs/tags/}
          release_date=$(git log -1 --format=%cs)
          {
            echo "version=$tag"
            echo "release_date=$release_date"
            echo "immutable_image=${REGISTRY_IMAGE}:sha-${GITHUB_SHA}"
            echo "release_image=${REGISTRY_IMAGE}:$tag"
            echo "images<<EOF"
            echo "${REGISTRY_IMAGE}:sha-${GITHUB_SHA}"
            echo "${REGISTRY_IMAGE}:$tag"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and smoke production image
        uses: ./.github/actions/build-production-image
        with:
          tags: ${{ steps.metadata.outputs.images }}
          smoke_image: ${{ steps.metadata.outputs.immutable_image }}
          app_version: ${{ steps.metadata.outputs.version }}
          release_date: ${{ steps.metadata.outputs.release_date }}

      - name: Log in to registry
        shell: bash
        env:
          REGISTRY_USERNAME: ${{ gitea.actor }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GITEA_TOKEN" || { echo "GITEA_TOKEN is unavailable." >&2; exit 1; }
          printf '%s' "$GITEA_TOKEN" | docker login "$REGISTRY_HOST" \
            --username "$REGISTRY_USERNAME" --password-stdin

      - name: Publish immutable release tags
        shell: bash
        env:
          IMAGES: ${{ steps.metadata.outputs.images }}
        run: |
          set -euo pipefail
          while IFS= read -r image; do
            [ -n "$image" ] && docker push "$image"
          done <<< "$IMAGES"

      - name: Pull back and smoke exact release tag
        shell: bash
        env:
          IMMUTABLE_IMAGE: ${{ steps.metadata.outputs.immutable_image }}
          RELEASE_IMAGE: ${{ steps.metadata.outputs.release_image }}
          EXPECTED_VERSION: ${{ steps.metadata.outputs.version }}
          EXPECTED_RELEASE_DATE: ${{ steps.metadata.outputs.release_date }}
        run: |
          set -euo pipefail
          docker image rm "$IMMUTABLE_IMAGE" "$RELEASE_IMAGE"
          docker pull "$RELEASE_IMAGE"
          sh tools/smoke-production-image.sh "$RELEASE_IMAGE" "$EXPECTED_VERSION" "$EXPECTED_RELEASE_DATE"

      - name: Remove workflow image tags
        if: ${{ always() }}
        shell: bash
        env:
          IMMUTABLE_IMAGE: ${{ steps.metadata.outputs.immutable_image }}
          RELEASE_IMAGE: ${{ steps.metadata.outputs.release_image }}
        run: |
          [ -n "$IMMUTABLE_IMAGE" ] && docker image rm "$IMMUTABLE_IMAGE" >/dev/null 2>&1 || true
          [ -n "$RELEASE_IMAGE" ] && docker image rm "$RELEASE_IMAGE" >/dev/null 2>&1 || true
