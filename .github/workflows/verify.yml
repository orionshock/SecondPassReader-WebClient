name: Verify

on:
  push:
    branches:
      - "**"
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Full Web verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up verification environment
        uses: ./.github/actions/setup-verification

      - name: Run the canonical repository gate
        run: npm run verify
