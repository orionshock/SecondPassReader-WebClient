name: Set up Web verification
description: Install the repository-declared Node.js, npm, and locked dependencies.

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: .node-version

    - name: Restore npm download cache
      uses: actions/cache@v4.1.2
      with:
        path: .npm-cache
        key: ${{ runner.os }}-npm-${{ hashFiles('.node-version', 'package.json', 'package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-npm-

    - name: Install exact npm and locked dependencies
      shell: bash
      run: |
        set -euo pipefail
        npm_version=$(node -p "require('./package.json').packageManager.split('@')[1]")
        npm install --global "npm@$npm_version"
        npm ci
