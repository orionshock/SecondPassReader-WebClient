name: Build and smoke production image
description: Build the production Dockerfile and exercise the resulting nginx image.

inputs:
  tags:
    description: One or more newline-separated local image references.
    required: true
  smoke_image:
    description: Image reference exercised by the production smoke test.
    required: true
  version:
    description: Web Client version embedded in the application bundle.
    required: true
  release_date:
    description: Commit release date embedded in the application bundle.
    required: true

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build production image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/Dockerfile
        load: true
        push: false
        tags: ${{ inputs.tags }}
        build-args: |
          SECONDPASS_WEBCLIENT_VERSION=${{ inputs.version }}
          SECONDPASS_WEBCLIENT_RELEASE_DATE=${{ inputs.release_date }}
        labels: |
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.version=${{ inputs.version }}

    - name: Exercise production image
      shell: bash
      env:
        IMAGE: ${{ inputs.smoke_image }}
        EXPECTED_VERSION: ${{ inputs.version }}
        EXPECTED_RELEASE_DATE: ${{ inputs.release_date }}
      run: sh tools/smoke-production-image.sh "$IMAGE" "$EXPECTED_VERSION" "$EXPECTED_RELEASE_DATE"
